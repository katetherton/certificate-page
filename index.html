<!DOCTYPE html>
<html lang="en">
<head>
  <meta charset="UTF-8">
  <meta name="viewport" content="width=device-width, initial-scale=1.0">
  <title>Certificate of Completion</title>

  <style>
    * {
      box-sizing: border-box;
    }

    body {
      margin: 0;
      padding: 12px;
      background-color: #f5f5f5;
      font-family: Georgia, serif;
      text-align: center;
    }

    .certificate {
      background: white;
      width: 100%;
      max-width: 900px;
      margin: auto;
      padding: 36px 24px;
      border: 8px solid #1f4e79;
      box-shadow: 0 0 12px rgba(0,0,0,0.15);
    }

    h1 {
      color: #1f4e79;
      font-size: clamp(30px, 8vw, 52px);
      line-height: 1.1;
      margin: 0 0 28px 0;
      word-wrap: break-word;
    }

    .subtitle {
      font-size: clamp(17px, 4.5vw, 24px);
      margin-bottom: 16px;
    }

    .name {
      font-size: clamp(28px, 7vw, 46px);
      font-weight: bold;
      margin: 24px 0;
      color: #000;
      overflow-wrap: break-word;
    }

    .training {
      font-size: clamp(22px, 5.5vw, 30px);
      font-weight: bold;
      margin: 24px 0;
      color: #1f4e79;
      overflow-wrap: break-word;
    }

    .date {
      font-size: clamp(16px, 4vw, 22px);
      margin-top: 22px;
      overflow-wrap: break-word;
    }

    .footer {
      margin-top: 38px;
      font-size: clamp(15px, 3.8vw, 20px);
      color: #444;
      overflow-wrap: break-word;
    }

    @media (max-width: 480px) {
      body {
        padding: 8px;
      }

      .certificate {
        padding: 28px 16px;
        border-width: 6px;
      }
    }

    @media print {
      body {
        background: white;
        padding: 0;
      }

      .certificate {
        box-shadow: none;
      }
    }
  </style>
</head>

<body>

  <div class="certificate">

    <h1>Certificate of Completion</h1>

    <div class="subtitle">
      This certifies that
    </div>

    <div class="name" id="studentName">
      Student Name
    </div>

    <div class="subtitle">
      has successfully completed
    </div>

    <div class="training" id="trainingName">
      History of Terminology and Current Etiquette
    </div>

    <div class="date">
      Completed on:
      <span id="completionTime"></span>
    </div>

    <div class="footer">
      Creighton University School of Dentistry
    </div>

  </div>

  <script>
    const params = new URLSearchParams(window.location.search);

    const studentName =
      params.get("name") || "Student Name";

    const trainingName =
      params.get("training") || "History of Terminology and Current Etiquette";

    const completionTime =
      params.get("time") || new Date().toLocaleString();

    document.getElementById("studentName").textContent =
      decodeURIComponent(studentName);

    document.getElementById("trainingName").textContent =
      decodeURIComponent(trainingName);

    document.getElementById("completionTime").textContent =
      decodeURIComponent(completionTime);
  </script>

</body>
</html>
